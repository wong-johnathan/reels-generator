paths:
  /healthz:
    get:
      operationId: health.live
      summary: Liveness probe
      tags:
        - healthz
      x-milestone: A
      responses:
        "200":
          description: Liveness probe
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required:
                  - status
                additionalProperties: false
  /readyz:
    get:
      operationId: health.ready
      summary: Readiness probe (503 while a dependency is down — R-018)
      tags:
        - readyz
      x-milestone: A
      responses:
        "200":
          description: Readiness probe (503 while a dependency is down — R-018)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                  degraded_reasons:
                    type: array
                    items:
                      type: string
                required:
                  - ready
                  - degraded_reasons
                additionalProperties: false
