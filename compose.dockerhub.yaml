# Docker Hub variant of compose.yaml — pulls the latest published release.
#
#   docker compose -f compose.dockerhub.yaml up -d
#
# No GHCR login, no digest pins: every application image tracks `:latest`, which
# CI republishes on each push to main. Trade-off, stated plainly — this file is
# NOT reproducible: bring up the same file a week apart and you get different
# builds. compose.yaml remains the pinned, audit-friendly path (R-016-1); use
# this one when you just want the current build running on the NAS.
#
# Everything except the five application images is identical to compose.yaml,
# and tests/compose.test.ts fails the build if the two ever diverge.
name: reels-generator

x-app: &app
  platform: linux/amd64
  env_file: .env
  networks: [private]
  stop_grace_period: 30s

services:
  web:
    <<: *app
    image: ${DOCKERHUB_USER:-wongjohnathanwh741}/reels-generator-web:latest
    restart: unless-stopped
    environment:
      ROLE: web
    # R-016-3: the only published port in the whole stack.
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'dist/src/api/healthcheck.js']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 512m

  content-worker:
    <<: *app
    image: ${DOCKERHUB_USER:-wongjohnathanwh741}/reels-generator-worker:latest
    restart: unless-stopped
    environment:
      ROLE: content
      WORKER_HTTP_PORT: '8081'
      HEALTHCHECK_URL: http://127.0.0.1:8081/readyz
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'dist/src/api/healthcheck.js']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 512m

  render-worker:
    <<: *app
    image: ${DOCKERHUB_USER:-wongjohnathanwh741}/reels-generator-worker:latest
    restart: unless-stopped
    environment:
      ROLE: render
      WORKER_HTTP_PORT: '8082'
      HEALTHCHECK_URL: http://127.0.0.1:8082/readyz
      RENDER_MEM_LIMIT_MB: ${RENDER_MEM_LIMIT_MB:-2048}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'dist/src/api/healthcheck.js']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # The only 2 GB service: FFmpeg at 1080x1920 (TECH_DESIGN §2.1, risk #2).
    mem_limit: 2g

  postgres:
    # Pinned by tag + digest; resolve a new one with `docker buildx imagetools inspect`.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [private]
    mem_limit: 2g

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    platform: linux/amd64
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [private]
    mem_limit: 256m

  minio:
    # Hardcoded on purpose, so this file needs no release variables: `minio/minio` is no
    # longer published on Docker Hub (404) and the quay.io manifest is not anonymously
    # resolvable from here, so the digest could not be verified. Tag only — reproducible
    # pinning is compose.yaml's job. quay.io may require `docker login quay.io` on the NAS;
    # if it does, or you mirror the image elsewhere, override the single line below.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: ['server', '/data', '--console-address', ':9001']
    volumes:
      - miniodata:/data
    healthcheck:
      # The official image ships `mc`; `mc ready local` is the documented probe.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [private]
    mem_limit: 512m

  # ── profile-gated one-shots ──
  migrate:
    profiles: ['migrate']
    <<: *app
    image: ${DOCKERHUB_USER:-wongjohnathanwh741}/reels-generator-worker:latest
    restart: 'no'
    # The worker image's ENTRYPOINT hard-codes --role worker; the one-shot must
    # validate as the migrate role (stores only) and run the migration runner, not the
    # queue consumer.
    entrypoint: ['node', 'dist/src/boot/validate-env.js', '--role', 'migrate', '--exec']
    command: ['node', 'dist/src/db/migrate.js']
    environment:
      ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  backup:
    profiles: ['backup']
    platform: linux/amd64
    env_file: .env
    networks: [private]
    image: ${DOCKERHUB_USER:-wongjohnathanwh741}/reels-generator-ops:latest
    restart: 'no'
    environment:
      ROLE: ops
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # R-016-4: backups live on the host, outside the compose project.
    volumes:
      - ./backups:/backups
      - ./config:/app/config:ro
    mem_limit: 512m

networks:
  private:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
