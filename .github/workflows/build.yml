# Builds web/worker/ops off-NAS and publishes them to GHCR as linux/amd64 by tag + digest.
# The NAS only pulls by digest (R-016-2, TECH_DESIGN §9.7). It never builds.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  NODE_VERSION: '20'

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-24.04
    # The schema and attempt-row-guard tests need a real Postgres 16 with
    # pgcrypto + pgvector (B-02, evidence/B-02.md). A service container keeps
    # that honest in CI instead of silently skipping the suite. Pinned by
    # linux/amd64 digest like every other image here (R-016).
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a97d77306ff47cc1d8add4d000cec2207da2e110746318df3137ce53c337ca30
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reels_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reels_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Each DB-backed test file provisions its own throwaway database here.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/reels_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Contract regeneration is clean (openapi.yaml matches api.ts)
        run: npm run contract:openapi && git diff --exit-code -- contract/openapi.yaml
      - name: No .env file ever entered the history
        run: |
          if git log --all --format=%H -- .env | grep -q .; then
            echo "::error::.env is present in git history — R-015-5 violation"
            exit 1
          fi

  images:
    name: image ${{ matrix.name }}
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: Dockerfile.web
          - name: worker
            dockerfile: Dockerfile.worker
          - name: ops
            dockerfile: Dockerfile.ops
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, tag + digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record the digest the NAS will pull
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.name }}.digest"
          echo "### ${{ matrix.name }}: \`${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ env.RELEASE_TAG }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}.digest
          retention-days: 90

  release-manifest:
    name: release manifest (images.env)
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Compose the image pins
        run: |
          set -euo pipefail
          read -r WEB_DIGEST < digests/web.digest
          read -r WORKER_DIGEST < digests/worker.digest
          read -r OPS_DIGEST < digests/ops.digest

          # docker/build-push-action reports `digest` as `sha256:<64 hex>`, but
          # compose.yaml pins `...@sha256:${WEB_DIGEST}`. images.env therefore
          # carries the bare 64-hex digest; keeping the prefix would produce
          # `@sha256:sha256:<hex>` and the NAS pull would fail (R-016-1/2).
          for digest in "$WEB_DIGEST" "$WORKER_DIGEST" "$OPS_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::the build job returned an unexpected digest: $digest"
              exit 1
            fi
          done
          WEB_DIGEST="${WEB_DIGEST#sha256:}"
          WORKER_DIGEST="${WORKER_DIGEST#sha256:}"
          OPS_DIGEST="${OPS_DIGEST#sha256:}"
          {
            echo "# Generated by .github/workflows/build.yml for ${{ env.RELEASE_TAG }}"
            echo "RELEASE_TAG=${{ env.RELEASE_TAG }}"
            echo "WEB_DIGEST=$WEB_DIGEST"
            echo "WORKER_DIGEST=$WORKER_DIGEST"
            echo "OPS_DIGEST=$OPS_DIGEST"
          } > images.env
          cat images.env >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: images-env
          path: images.env
          retention-days: 90
