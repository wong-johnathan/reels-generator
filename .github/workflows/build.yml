# Builds web/worker/ops off-NAS and publishes them to GHCR as linux/amd64 by tag + digest.
# The NAS only pulls by digest (R-016-2, TECH_DESIGN §9.7). It never builds.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  # Mirror of the same images on Docker Hub, so the NAS can pull without GHCR auth.
  DOCKERHUB_PREFIX: wongjohnathanwh741/reels-generator
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  NODE_VERSION: '20'

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-24.04
    # The schema and attempt-row-guard tests need a real Postgres 16 with
    # pgcrypto + pgvector (B-02, evidence/B-02.md). A service container keeps
    # that honest in CI instead of silently skipping the suite. Pinned by
    # linux/amd64 digest like every other image here (R-016).
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a97d77306ff47cc1d8add4d000cec2207da2e110746318df3137ce53c337ca30
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reels_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reels_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Each DB-backed test file provisions its own throwaway database here.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/reels_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Contract regeneration is clean (openapi.yaml matches api.ts)
        run: npm run contract:openapi && git diff --exit-code -- contract/openapi.yaml
      - name: Env template is current (matches src/config/env.ts)
        run: npm run env:template && git diff --exit-code -- .env.template
      - name: No .env file ever entered the history
        run: |
          if git log --all --format=%H -- .env | grep -q .; then
            echo "::error::.env is present in git history — R-015-5 violation"
            exit 1
          fi

  images:
    name: image ${{ matrix.name }}
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: Dockerfile.web
          - name: worker
            dockerfile: Dockerfile.worker
          - name: ops
            dockerfile: Dockerfile.ops
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub mirror. Same linux/amd64 manifest, same digest: the NAS may pull
      # either registry and the release pin stays one digest per image.
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push (linux/amd64, tag + digest) to GHCR and Docker Hub
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ env.RELEASE_TAG }}
            ${{ env.DOCKERHUB_PREFIX }}-${{ matrix.name }}:${{ env.RELEASE_TAG }}
            ${{ github.ref == 'refs/heads/main' && format('{0}-{1}:latest', env.DOCKERHUB_PREFIX, matrix.name) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record what was published
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- hub:  `${{ env.DOCKERHUB_PREFIX }}-${{ matrix.name }}:${{ env.RELEASE_TAG }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- hub:  `${{ env.DOCKERHUB_PREFIX }}-${{ matrix.name }}:latest` (main only)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr: `${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ env.RELEASE_TAG }}`" >> "$GITHUB_STEP_SUMMARY"
