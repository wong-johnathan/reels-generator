# reels-generator — Milestone A compose topology (R-016, TECH_DESIGN §2.4 / §9.1)
#
# Rules this file encodes, and the tests that keep them true (tests/compose.test.ts):
#   - every image is pinned by tag AND digest, `linux/amd64` (R-016-1, DS923+ is x86_64);
#   - only `web` publishes a host port; postgres/redis/minio stay on a private network (R-016-3);
#   - the NAS never builds: there is no `build:` key anywhere (R-016-2);
#   - `down` keeps data: named volumes plus `./backups`; never `down -v` (R-016-4);
#   - every service has a healthcheck and a restart policy (except the one-shots).
#
# The NAS pulls by digest only. `migrate`/`backup` are profile-gated one-shots:
#   docker compose --profile migrate run --rm migrate
#   docker compose --profile backup  run --rm backup
#
# NOTE (deviation from TECH_DESIGN §9.2, documented in docs/DEPLOYMENT.md):
# web/workers do not `depends_on: migrate`. Compose cannot gate a default-profile
# service on a profile-gated one-shot, so `deploy/up.sh` runs migrate first, then `up`.
name: reels-generator

x-app: &app
  platform: linux/amd64
  env_file: .env
  networks: [private]
  stop_grace_period: 30s

services:
  web:
    <<: *app
    image: ghcr.io/wong-johnathan/reels-generator/web:${RELEASE_TAG:?RELEASE_TAG must be the release tag printed by the CI release job}@sha256:${WEB_DIGEST:?WEB_DIGEST must be the digest printed by the CI release job}
    restart: unless-stopped
    environment:
      ROLE: web
    # R-016-3: the only published port in the whole stack.
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'dist/src/api/healthcheck.js']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 512m

  content-worker:
    <<: *app
    image: ghcr.io/wong-johnathan/reels-generator/worker:${RELEASE_TAG:?}@sha256:${WORKER_DIGEST:?WORKER_DIGEST must be the digest printed by the CI release job}
    restart: unless-stopped
    environment:
      ROLE: content
      WORKER_HTTP_PORT: '8081'
      HEALTHCHECK_URL: http://127.0.0.1:8081/readyz
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'dist/src/api/healthcheck.js']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 512m

  render-worker:
    <<: *app
    image: ghcr.io/wong-johnathan/reels-generator/worker:${RELEASE_TAG:?}@sha256:${WORKER_DIGEST:?}
    restart: unless-stopped
    environment:
      ROLE: render
      WORKER_HTTP_PORT: '8082'
      HEALTHCHECK_URL: http://127.0.0.1:8082/readyz
      RENDER_MEM_LIMIT_MB: ${RENDER_MEM_LIMIT_MB:-2048}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'dist/src/api/healthcheck.js']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # The only 2 GB service: FFmpeg at 1080x1920 (TECH_DESIGN §2.1, risk #2).
    mem_limit: 2g

  postgres:
    # Pinned by tag + digest; resolve a new one with `docker buildx imagetools inspect`.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [private]
    mem_limit: 2g

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    platform: linux/amd64
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [private]
    mem_limit: 256m

  minio:
    # The object store image is operator-supplied: `minio/minio` is no longer published on
    # Docker Hub (404 as of 2026-10-20) and quay.io/minio/minio requires registry auth.
    # MINIO_IMAGE must be a digest-pinned ref, e.g. quay.io/minio/minio:vX@sha256:…
    image: ${MINIO_IMAGE:?MINIO_IMAGE must be a digest-pinned object-store image (see docs/DEPLOYMENT.md)}
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: ['server', '/data', '--console-address', ':9001']
    volumes:
      - miniodata:/data
    healthcheck:
      # The official image ships `mc`; `mc ready local` is the documented probe.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [private]
    mem_limit: 512m

  # ── profile-gated one-shots ──
  migrate:
    profiles: ['migrate']
    <<: *app
    image: ghcr.io/wong-johnathan/reels-generator/worker:${RELEASE_TAG:?}@sha256:${WORKER_DIGEST:?}
    restart: 'no'
    # The worker image's ENTRYPOINT hard-codes --role worker; the one-shot must
    # validate as the migrate role (stores only) and run the migration runner, not the
    # queue consumer.
    entrypoint: ['node', 'dist/src/boot/validate-env.js', '--role', 'migrate', '--exec']
    command: ['node', 'dist/src/db/migrate.js']
    environment:
      ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  backup:
    profiles: ['backup']
    platform: linux/amd64
    env_file: .env
    networks: [private]
    image: ghcr.io/wong-johnathan/reels-generator/ops:${RELEASE_TAG:?}@sha256:${OPS_DIGEST:?OPS_DIGEST must be the digest printed by the CI release job}
    restart: 'no'
    environment:
      ROLE: ops
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # R-016-4: backups live on the host, outside the compose project.
    volumes:
      - ./backups:/backups
      - ./config:/app/config:ro
    mem_limit: 512m

networks:
  private:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
