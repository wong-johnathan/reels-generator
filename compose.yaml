# reels-generator — Milestone A compose topology (R-016, TECH_DESIGN §2.4 / §9.1)
#
# Rules this file encodes, and the tests that keep them true (tests/compose.test.ts):
#   - every image runs `linux/amd64` (DS923+ is x86_64) and application images track
#     `:latest`, pulled fresh on each deploy (`pull_policy: always`). See DEVIATIONS.md:
#     this trades R-016-1's digest pinning for one-tag simplicity, by operator decision;
#   - only `web` publishes a host port; postgres/redis/minio stay on a private network (R-016-3);
#   - the NAS never builds: there is no `build:` key anywhere (R-016-2);
#   - `down` keeps data: named volumes plus `./backups`; never `down -v` (R-016-4);
#   - every service has a healthcheck and a restart policy (except the one-shots).
#
# The NAS never builds; it pulls `:latest` on each deploy. `migrate`/`backup` are one-shots:
#   docker compose --profile migrate run --rm migrate
#   docker compose --profile backup  run --rm backup
#
# NOTE (deviation from TECH_DESIGN §9.2, documented in docs/DEPLOYMENT.md):
# web/workers do not `depends_on: migrate`. Compose cannot gate a default-profile
# service on a profile-gated one-shot, so `deploy/up.sh` runs migrate first, then `up`.
name: reels-generator

x-app: &app
  platform: linux/amd64
  env_file: .env
  networks: [private]
  stop_grace_period: 30s
  # `:latest` only means "newest" if compose re-pulls; without this a redeploy
  # silently reuses the cached image.
  pull_policy: always

services:
  web:
    <<: *app
    image: ${DOCKERHUB_USER:-wongjohnathanwh741}/reels-generator-web:latest
    restart: unless-stopped
    environment:
      ROLE: web
    # R-016-3: the only published port in the whole stack.
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'dist/src/api/healthcheck.js']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 512m

  content-worker:
    <<: *app
    image: ${DOCKERHUB_USER:-wongjohnathanwh741}/reels-generator-worker:latest
    restart: unless-stopped
    environment:
      ROLE: content
      WORKER_HTTP_PORT: '8081'
      HEALTHCHECK_URL: http://127.0.0.1:8081/readyz
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'dist/src/api/healthcheck.js']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 512m

  render-worker:
    <<: *app
    image: ${DOCKERHUB_USER:-wongjohnathanwh741}/reels-generator-worker:latest
    restart: unless-stopped
    environment:
      ROLE: render
      WORKER_HTTP_PORT: '8082'
      HEALTHCHECK_URL: http://127.0.0.1:8082/readyz
      RENDER_MEM_LIMIT_MB: ${RENDER_MEM_LIMIT_MB:-2048}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'dist/src/api/healthcheck.js']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # The only 2 GB service: FFmpeg at 1080x1920 (TECH_DESIGN §2.1, risk #2).
    mem_limit: 2g

  postgres:
    # Two constraints, both load-bearing:
    #   - pgvector must be present, or m001 refuses to run (R-020, TECH_DESIGN §3);
    #     upstream `postgres:16-alpine` does not ship the extension.
    #   - the major version must match the ops image's pg_dump 16 (R-017-5).
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [private]
    mem_limit: 2g

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [private]
    mem_limit: 256m

  minio:
    # Hardcoded here because `minio/minio` is no longer published on Docker Hub (404) and
    # the quay.io manifest is not anonymously resolvable, so neither a Docker Hub name nor
    # a verified digest exists to point at. Change this one line to mirror it elsewhere.
    # quay.io may require `docker login quay.io` on the NAS.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: ['server', '/data', '--console-address', ':9001']
    volumes:
      - miniodata:/data
    healthcheck:
      # The official image ships `mc`; `mc ready local` is the documented probe.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [private]
    mem_limit: 512m

  # ── profile-gated one-shots ──
  migrate:
    profiles: ['migrate']
    <<: *app
    image: ${DOCKERHUB_USER:-wongjohnathanwh741}/reels-generator-worker:latest
    restart: 'no'
    # The worker image's ENTRYPOINT hard-codes --role worker; the one-shot must
    # validate as the migrate role (stores only) and run the migration runner, not the
    # queue consumer.
    entrypoint: ['node', 'dist/src/boot/validate-env.js', '--role', 'migrate', '--exec']
    command: ['node', 'dist/src/db/migrate.js']
    environment:
      ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  backup:
    profiles: ['backup']
    platform: linux/amd64
    env_file: .env
    networks: [private]
    pull_policy: always
    image: ${DOCKERHUB_USER:-wongjohnathanwh741}/reels-generator-ops:latest
    restart: 'no'
    environment:
      ROLE: ops
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # R-016-4: backups live on the host, outside the compose project.
    volumes:
      - ./backups:/backups
      - ./config:/app/config:ro
    mem_limit: 512m

networks:
  private:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
